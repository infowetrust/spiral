<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Spiral</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5ef;
      --fg: #24211c;
      --muted: #6f6a60;
      --line: rgba(36, 33, 28, 0.34);
      --guide: rgba(36, 33, 28, 0.18);
      --cell-stroke: rgba(36, 33, 28, 0.22);
      --panel: rgba(255, 255, 255, 0.58);
      --border: rgba(36, 33, 28, 0.16);
      --shadow: rgba(36, 33, 28, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181714;
        --fg: #efebe1;
        --muted: #b9b1a3;
        --line: rgba(239, 235, 225, 0.38);
        --guide: rgba(239, 235, 225, 0.18);
        --cell-stroke: rgba(239, 235, 225, 0.24);
        --panel: rgba(255, 255, 255, 0.07);
        --border: rgba(239, 235, 225, 0.16);
        --shadow: rgba(0, 0, 0, 0.22);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px clamp(14px, 3vw, 34px) 34px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.35rem, 2.2vw, 2rem);
      font-weight: 500;
      letter-spacing: 0;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .view-controls {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .view-button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
      padding: 7px 12px;
    }

    .view-button[aria-pressed="true"] {
      background: var(--fg);
      border-color: var(--fg);
      color: var(--bg);
    }

    .color-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .explainer {
      max-width: 760px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    select {
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      font: inherit;
      font-size: 0.9rem;
      padding: 7px 28px 7px 12px;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(6, max-content);
      gap: 7px 12px;
      justify-content: end;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--month-color);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
    }

    .scale-legend {
      width: min(310px, 100%);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .scale-title {
      color: var(--fg);
      font-weight: 500;
      margin-bottom: 6px;
    }

    .scale-ramp {
      height: 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--ramp);
    }

    .scale-values {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 5px;
    }

    .stage {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 18px 60px var(--shadow);
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .thread {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .month-tick {
      stroke: var(--fg);
      stroke-width: 1.2;
      opacity: 0.65;
      vector-effect: non-scaling-stroke;
    }

    .month-label {
      fill: var(--fg);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-linejoin: round;
      stroke-width: 3.5;
    }

    .day {
      fill: var(--month-color);
      opacity: 0.84;
    }

    .area-cell {
      fill: var(--month-color);
      opacity: 0.9;
      stroke: none;
    }

    .seasonal-ribbon {
      fill: var(--month-color);
      opacity: 0.26;
      stroke: none;
      pointer-events: none;
    }

    .jan-one {
      fill: var(--bg);
      stroke: var(--fg);
      stroke-width: 1.35;
      vector-effect: non-scaling-stroke;
    }

    .year-label,
    .axis-label,
    .date-label {
      fill: var(--fg);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .axis-label,
    .date-label {
      font-size: 14px;
    }

    .summary-axis,
    .summary-tick {
      stroke: #444;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .summary-line {
      fill: none;
      stroke: #444;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .summary-label {
      fill: #444;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .summary-small {
      fill: #444;
      font-size: 10px;
      letter-spacing: 0;
    }

    .hover-tooltip {
      position: absolute;
      z-index: 2;
      max-width: 230px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      box-shadow: 0 10px 30px var(--shadow);
      font-size: 0.82rem;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - 10px));
    }

    .hover-tooltip[hidden] {
      display: none;
    }

    .tooltip-date {
      font-weight: 500;
      margin-bottom: 2px;
    }

    .tooltip-value {
      color: var(--muted);
    }

    .caption {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 14px 13px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.84rem;
    }

    @media (max-width: 820px) {
      header {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .legend {
        grid-template-columns: repeat(4, max-content);
        justify-content: start;
      }
    }

    @media (max-width: 520px) {
      main {
        padding-inline: 10px;
      }

      .legend {
        grid-template-columns: repeat(3, max-content);
        gap-column: 10px;
      }

      .caption {
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Time Spiral</h1>
        <p class="meta" id="meta"></p>
        <div class="controls">
          <div class="view-controls" role="group" aria-label="View">
            <button class="view-button" type="button" data-view="necklace" aria-pressed="false">Necklace</button>
            <button class="view-button" type="button" data-view="area" aria-pressed="true">Area fill</button>
          </div>
          <label class="color-control" for="color-select">
            Color
            <select id="color-select">
              <option value="month">Month</option>
              <option value="tempHigh">Daily high temperature</option>
              <option value="windMax">Daily max wind</option>
              <option value="windEnergy">Daily wind energy</option>
              <option value="precipitation">Daily precipitation</option>
              <option value="solar">Daily solar radiation</option>
              <option value="fogProxy">Fog / marine-layer proxy</option>
            </select>
          </label>
          <label class="color-control" for="scheme-select">
            Scheme
            <select id="scheme-select">
              <option value="continuous">Continuous</option>
              <option value="quantile">Quantize: equal marks</option>
              <option value="equalInterval">Quantize: equal range</option>
            </select>
          </label>
        </div>
        <p class="explainer" id="explainer"></p>
      </div>
      <div class="legend" id="legend" aria-label="Month colors"></div>
    </header>

    <section class="stage" aria-label="Daily time spiral for the past ten years">
      <svg id="spiral" viewBox="0 0 1000 1000" role="img" aria-labelledby="spiral-title spiral-desc">
        <title id="spiral-title">Past ten years as a daily time spiral</title>
        <desc id="spiral-desc">
          Each dot is one day. Radius increases toward the present. One full turn is one tropical year.
        </desc>
        <line class="guide" x1="500" y1="70" x2="500" y2="285"></line>
        <text class="axis-label" x="500" y="48" text-anchor="middle">Jan 1</text>
        <g id="area-cells"></g>
        <g id="seasonal-ribbon"></g>
        <path class="thread" id="thread"></path>
        <g id="days"></g>
        <g id="date-labels"></g>
        <g id="summary-plot"></g>
        <g id="month-scale"></g>
      </svg>
      <div class="hover-tooltip" id="hover-tooltip" hidden>
        <div class="tooltip-date" id="tooltip-date"></div>
        <div class="tooltip-value" id="tooltip-value"></div>
      </div>
      <div class="caption">
        <span id="caption-left">Outer edge is the most recent date.</span>
        <span id="caption-right">One revolution = 365.24219 days.</span>
      </div>
    </section>
  </main>

      const parseIsoDay = (iso) => {

      };

      const formatIsoDay = (date) => {
        const year = date.getUTCFullYear();
        const month = String(date.getUTCMonth() + 1).padStart(2, "0");
        const day = String(date.getUTCDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      };

      const formatDisplayDate = (date) => {
        const day = String(date.getUTCDate()).padStart(2, "0");
        const month = MONTHS[date.getUTCMonth()].short;
        return `${day} ${month} ${date.getUTCFullYear()}`;
      };

      const startMs = parseIsoDay(START_ISO);
      const endMs = parseIsoDay(END_ISO);
      const anchorMs = parseIsoDay(ANCHOR_JAN_1_ISO);
      const totalDays = Math.round((endMs - startMs) / MS_PER_DAY);
      const totalTurns = totalDays / TROPICAL_YEAR_DAYS;
      const areaEdgeMinTurn = -0.5;
      const areaEdgeMaxTurn = totalTurns + 0.5;
      const BIN_COUNT = 7;
      const DATASETS = {

        fogProxy: {
          label: "Fog / marine-layer proxy",

          stops: ["#fff7bc", "#d9f0a3", "#78c6a3", "#2b8cbe", "#253494"],

      const finiteValues = (values) => values.filter((value) => Number.isFinite(value));
      const numberExtent = (values) => {
        const finite = finiteValues(values);
        if (!finite.length) {
          return { min: NaN, max: NaN };
        }
        return {
          min: Math.min(...finite),
          max: Math.max(...finite)
        };
      };

      const quantileBinsByIndex = (values, zeroAsEmpty = false) => {
        const bins = Array(values.length).fill(-1);
        const ranked = values
          .map((value, index) => ({ value, index }))
          .filter((item) => Number.isFinite(item.value) && (!zeroAsEmpty || item.value > 0))
          .sort((a, b) => a.value - b.value || a.index - b.index);

        ranked.forEach((item, rank) => {
          bins[item.index] = Math.min(BIN_COUNT - 1, Math.floor(rank * BIN_COUNT / ranked.length));
        });

        return bins;
      };

      Object.values(DATASETS).forEach((dataset) => {
        if (dataset.values.length !== totalDays + 1) {
          throw new Error(`${dataset.label} has ${dataset.values.length} values; expected ${totalDays + 1}.`);

        dataset.zeroAsEmpty = dataset.min === 0 && dataset.values.some((value) => value === 0);
        const positiveExtent = numberExtent(dataset.values.filter((value) => value > 0));
        dataset.scaleMin = dataset.zeroAsEmpty && Number.isFinite(positiveExtent.min) ? positiveExtent.min : dataset.min;
        dataset.scaleMax = dataset.max;
        dataset.quantileBins = quantileBinsByIndex(dataset.values, dataset.zeroAsEmpty);
      });

      const angleForDayOffset = (dayOffset) => {
        const dateMs = startMs + dayOffset * MS_PER_DAY;
        const elapsedFromAnchor = (dateMs - anchorMs) / MS_PER_DAY;
        return -Math.PI / 2 + 2 * Math.PI * (elapsedFromAnchor / TROPICAL_YEAR_DAYS);
      };

      const radiusForNecklaceDay = (dayIndex) => {
        const ageFromStart = dayIndex / totalDays;
        return INNER_RADIUS + ageFromStart * (OUTER_RADIUS - INNER_RADIUS);
      };

      const radiusForAreaTurn = (turn) => {
        const t = (turn - areaEdgeMinTurn) / (areaEdgeMaxTurn - areaEdgeMinTurn);
        const radiusSquared = INNER_RADIUS ** 2 + t * (OUTER_RADIUS ** 2 - INNER_RADIUS ** 2);
        return Math.sqrt(radiusSquared);
      };

      const pointFromPolar = (radius, angle) => ({
        x: CENTER + radius * Math.cos(angle),
        y: CENTER + radius * Math.sin(angle)
      });

      const angleForSeasonDay = (seasonDay) => -Math.PI / 2 + 2 * Math.PI * (seasonDay / TROPICAL_YEAR_DAYS);

      const ribbonSegmentPath = (innerRadius, outerRadius, startAngle, endAngle) => {
        const outerStart = pointFromPolar(outerRadius, startAngle);
        const outerEnd = pointFromPolar(outerRadius, endAngle);
        const innerEnd = pointFromPolar(innerRadius, endAngle);
        const innerStart = pointFromPolar(innerRadius, startAngle);
        const largeArc = Math.abs(endAngle - startAngle) > Math.PI ? 1 : 0;
        return [
          `M${outerStart.x.toFixed(2)} ${outerStart.y.toFixed(2)}`,
          `A${outerRadius} ${outerRadius} 0 ${largeArc} 1 ${outerEnd.x.toFixed(2)} ${outerEnd.y.toFixed(2)}`,
          `L${innerEnd.x.toFixed(2)} ${innerEnd.y.toFixed(2)}`,
          `A${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${innerStart.x.toFixed(2)} ${innerStart.y.toFixed(2)}`,
          "Z"
        ].join(" ");
      };

      const pointForDay = (dayIndex, view) => {
        const dateMs = startMs + dayIndex * MS_PER_DAY;
        const turn = dayIndex / TROPICAL_YEAR_DAYS;
        const radius = view === "area" ? radiusForAreaTurn(turn) : radiusForNecklaceDay(dayIndex);
        const angle = angleForDayOffset(dayIndex);
        return {
          ...pointFromPolar(radius, angle),
          radius,
          angle,
          dateMs
        };
      };

      const areaEdgePoint = (turnAlongSpiral, radialTurnOffset) => {
        const radius = radiusForAreaTurn(turnAlongSpiral + radialTurnOffset);
        const angle = angleForDayOffset(turnAlongSpiral * TROPICAL_YEAR_DAYS);
        return pointFromPolar(radius, angle);
      };

      const areaCellPath = (dayIndex) => {
        const centerTurn = dayIndex / TROPICAL_YEAR_DAYS;
        const halfDayTurn = 0.5 / TROPICAL_YEAR_DAYS;
        const startTurn = centerTurn - halfDayTurn;
        const endTurn = centerTurn + halfDayTurn;
        const outer = [];
        const inner = [];

        for (let step = 0; step <= AREA_CELL_SAMPLES; step += 1) {
          const t = step / AREA_CELL_SAMPLES;
          const turn = startTurn + t * (endTurn - startTurn);
          outer.push(areaEdgePoint(turn, 0.5));
        }

        for (let step = AREA_CELL_SAMPLES; step >= 0; step -= 1) {
          const t = step / AREA_CELL_SAMPLES;
          const turn = startTurn + t * (endTurn - startTurn);
          inner.push(areaEdgePoint(turn, -0.5));
        }

        const [first, ...rest] = outer.concat(inner);
        return `M${first.x.toFixed(2)} ${first.y.toFixed(2)} ${rest.map((point) => `L${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(" ")} Z`;
      };

      const clamp01 = (value) => Math.max(0, Math.min(1, value));

      const hexToRgb = (hex) => {
        const clean = hex.replace("#", "");
        return {
          r: parseInt(clean.slice(0, 2), 16),
          g: parseInt(clean.slice(2, 4), 16),
          b: parseInt(clean.slice(4, 6), 16)
        };
      };

      const rgbToHex = ({ r, g, b }) => {
        const toHex = (channel) => Math.round(channel).toString(16).padStart(2, "0");
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      };

      const mixColor = (fromHex, toHex, amount) => {
        const from = hexToRgb(fromHex);
        const to = hexToRgb(toHex);
        const t = clamp01(amount);
        return rgbToHex({
          r: from.r + (to.r - from.r) * t,
          g: from.g + (to.g - from.g) * t,
          b: from.b + (to.b - from.b) * t
        });
      };

      const colorFromStops = (stops, amount) => {
        const t = clamp01(amount);
        const scaled = t * (stops.length - 1);
        const index = Math.min(stops.length - 2, Math.floor(scaled));
        return mixColor(stops[index], stops[index + 1], scaled - index);
      };

      const isEmptyValue = (dataset, value) => dataset.zeroAsEmpty && value === 0;

      const datasetColor = (dataset, value, scheme, dayIndex) => {
        if (!Number.isFinite(value)) {
          return "#b7b7b7";
        }
        if (isEmptyValue(dataset, value)) {
          return EMPTY_COLOR;
        }
        if (scheme === "quantile") {
          const bin = dataset.quantileBins[dayIndex];
          if (bin < 0) {
            return EMPTY_COLOR;
          }
          return colorFromStops(dataset.stops, bin / (BIN_COUNT - 1));
        }
        if (scheme === "equalInterval") {
          const span = dataset.scaleMax - dataset.scaleMin;
          const amount = span === 0 ? 0 : (value - dataset.scaleMin) / span;
          const bin = Math.min(BIN_COUNT - 1, Math.floor(clamp01(amount) * BIN_COUNT));
          return colorFromStops(dataset.stops, bin / (BIN_COUNT - 1));
        }
        if (Number.isFinite(dataset.pivot)) {
          if (value <= dataset.pivot) {
            return colorFromStops(dataset.stops.slice(0, 2), (value - dataset.min) / (dataset.pivot - dataset.min));
          }
          return colorFromStops(dataset.stops.slice(1), (value - dataset.pivot) / (dataset.max - dataset.pivot));
        }
        const span = dataset.scaleMax - dataset.scaleMin;
        return colorFromStops(dataset.stops, span === 0 ? 0 : (value - dataset.scaleMin) / span);
      };

      const dayColor = (dayIndex, monthIndex, colorMode, scheme) => {
        if (colorMode === "month") {
          return MONTHS[monthIndex].color;
        }
        const dataset = DATASETS[colorMode];
        return datasetColor(dataset, dataset.values[dayIndex], scheme, dayIndex);
      };

      const formatValue = (dataset, value) => {
        if (!Number.isFinite(value)) {
          return "missing";
        }
        return `${value.toFixed(dataset.precision ?? 1)} ${dataset.unit}`;
      };

      const titleForDay = (iso, dayIndex, colorMode) => {
        if (colorMode === "month") {
          return iso;
        }
        const dataset = DATASETS[colorMode];
        return `${iso} · ${dataset.label}: ${formatValue(dataset, dataset.values[dayIndex])}`;
      };

      const svg = document.getElementById("spiral");
      const areaCells = document.getElementById("area-cells");
      const seasonalRibbon = document.getElementById("seasonal-ribbon");
      const thread = document.getElementById("thread");
      const days = document.getElementById("days");
      const dateLabels = document.getElementById("date-labels");
      const summaryPlot = document.getElementById("summary-plot");
      const monthScale = document.getElementById("month-scale");
      const legend = document.getElementById("legend");
      const meta = document.getElementById("meta");
      const explainer = document.getElementById("explainer");
      const captionLeft = document.getElementById("caption-left");
      const captionRight = document.getElementById("caption-right");
      const colorSelect = document.getElementById("color-select");
      const schemeSelect = document.getElementById("scheme-select");
      const tooltip = document.getElementById("hover-tooltip");
      const tooltipDate = document.getElementById("tooltip-date");
      const tooltipValue = document.getElementById("tooltip-value");
      const viewButtons = Array.from(document.querySelectorAll("[data-view]"));
      const ns = "http://www.w3.org/2000/svg";
      let currentView = "area";
      let currentColorMode = "month";
      let currentScheme = "continuous";

      const clearGroup = (group) => {
        while (group.firstChild) {
          group.removeChild(group.firstChild);
        }
      };

      const appendTitle = (element, text) => {
        const title = document.createElementNS(ns, "title");
        title.textContent = text;
        element.appendChild(title);
      };

      const addSvgElement = (parent, tagName, attrs = {}, text = "") => {
        const element = document.createElementNS(ns, tagName);
        Object.entries(attrs).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });
        if (text) {
          element.textContent = text;
        }
        parent.appendChild(element);
        return element;
      };

      const dayOfSeason = (date) => Math.round(
        (Date.UTC(SEASON_YEAR, date.getUTCMonth(), date.getUTCDate()) - Date.UTC(SEASON_YEAR, 0, 1)) / MS_PER_DAY
      );

      const seasonalAverage = (dataset) => {
        const sums = Array(SEASON_DAYS).fill(0);
        const counts = Array(SEASON_DAYS).fill(0);

        for (let dayIndex = 0; dayIndex <= totalDays; dayIndex += 1) {
          const value = dataset.values[dayIndex];
          if (!Number.isFinite(value)) {
            continue;
          }
          const seasonIndex = dayOfSeason(new Date(startMs + dayIndex * MS_PER_DAY));
          sums[seasonIndex] += value;
          counts[seasonIndex] += 1;
        }

        return sums.map((sum, index) => counts[index] ? sum / counts[index] : NaN);
      };

      const smoothSeasonalAverage = (values) => values.map((_, index) => {
        let sum = 0;
        let count = 0;
        for (let offset = -SUMMARY_SMOOTH_RADIUS; offset <= SUMMARY_SMOOTH_RADIUS; offset += 1) {
          const wrappedIndex = (index + offset + SEASON_DAYS) % SEASON_DAYS;
          const value = values[wrappedIndex];
          if (Number.isFinite(value)) {
            sum += value;
            count += 1;
          }
        }
        return count ? sum / count : NaN;
      });

      const linePathFromSeries = (series, xForIndex, yForValue) => {
        let hasStarted = false;
        return series.map((value, index) => {
          if (!Number.isFinite(value)) {
            hasStarted = false;
            return "";
          }
          const command = hasStarted ? "L" : "M";
          hasStarted = true;
          return `${command}${xForIndex(index).toFixed(2)} ${yForValue(value).toFixed(2)}`;
        }).filter(Boolean).join(" ");
      };

      const renderSeasonalRibbon = (colorMode, view) => {
        clearGroup(seasonalRibbon);
        if (view !== "area" || colorMode === "month") {
          return;
        }

        const dataset = DATASETS[colorMode];
        const series = smoothSeasonalAverage(seasonalAverage(dataset));
        for (let startDay = 0; startDay < TROPICAL_YEAR_DAYS; startDay += RIBBON_DAY_STEP) {
          const endDay = Math.min(TROPICAL_YEAR_DAYS, startDay + RIBBON_DAY_STEP);
          let sum = 0;
          let count = 0;
          for (let index = Math.floor(startDay); index < Math.min(SEASON_DAYS, Math.ceil(endDay)); index += 1) {
            const value = series[index];
            if (Number.isFinite(value)) {
              sum += value;
              count += 1;
            }
          }
          if (!count) {
            continue;
          }

          const value = sum / count;
          const fillColor = datasetColor(dataset, value, "continuous", 0);
          if (fillColor === EMPTY_COLOR) {
            continue;
          }

          const segment = document.createElementNS(ns, "path");
          segment.setAttribute("class", "seasonal-ribbon");
          segment.setAttribute("d", ribbonSegmentPath(
            RIBBON_INNER_RADIUS,
            RIBBON_OUTER_RADIUS,
            angleForSeasonDay(startDay),
            angleForSeasonDay(endDay)
          ));
          segment.setAttribute("style", `--month-color: ${fillColor}`);
          seasonalRibbon.appendChild(segment);
        }
      };

      const renderSummaryPlot = (colorMode) => {
        clearGroup(summaryPlot);
        const summaryMode = colorMode === "month" ? "tempHigh" : colorMode;
        const dataset = DATASETS[summaryMode];
        const series = smoothSeasonalAverage(seasonalAverage(dataset));
        const { min, max } = numberExtent(series);
        if (!Number.isFinite(min) || !Number.isFinite(max)) {
          return;
        }

        const plot = {
          x: 360,
          y: 405,
          width: 280,
          height: 150
        };
        const span = max - min || 1;
        const xForIndex = (index) => plot.x + index / (SEASON_DAYS - 1) * plot.width;
        const yForValue = (value) => plot.y + plot.height - (value - min) / span * plot.height;
        const axisY = plot.y + plot.height;

        summaryPlot.setAttribute("aria-label", `${dataset.label}, 10-year smoothed average from January to December`);
        addSvgElement(summaryPlot, "text", {
          class: "summary-label",
          x: plot.x,
          y: plot.y - 16
        }, "10-year smoothed avg");
        addSvgElement(summaryPlot, "text", {
          class: "summary-small",
          x: plot.x + plot.width,
          y: plot.y - 16,
          "text-anchor": "end"
        }, `${dataset.metaLabel} (${dataset.unit})`);
        addSvgElement(summaryPlot, "line", {
          class: "summary-axis",
          x1: plot.x,
          y1: axisY,
          x2: plot.x + plot.width,
          y2: axisY
        });
        addSvgElement(summaryPlot, "line", {
          class: "summary-axis",
          x1: plot.x,
          y1: plot.y,
          x2: plot.x,
          y2: axisY
        });
        addSvgElement(summaryPlot, "line", {
          class: "summary-tick",
          x1: plot.x + plot.width,
          y1: axisY,
          x2: plot.x + plot.width,
          y2: axisY + 5
        });
        addSvgElement(summaryPlot, "text", {
          class: "summary-small",
          x: plot.x,
          y: axisY + 18,
          "text-anchor": "middle"
        }, "Jan");
        addSvgElement(summaryPlot, "text", {
          class: "summary-small",
          x: plot.x + plot.width,
          y: axisY + 18,
          "text-anchor": "middle"
        }, "Dec");
        addSvgElement(summaryPlot, "path", {
          class: "summary-line",
          d: linePathFromSeries(series, xForIndex, yForValue)
        });
      };

      const renderLegend = (colorMode, scheme) => {
        legend.replaceChildren();
        if (colorMode === "month") {
          legend.className = "legend";
          legend.setAttribute("aria-label", "Month colors");
          MONTHS.forEach((month) => {
            const item = document.createElement("span");
            item.className = "legend-item";
            item.innerHTML = `<span class="swatch" style="--month-color: ${month.color}"></span>${month.short}`;
            legend.appendChild(item);
          });
          return;
        }

        const dataset = DATASETS[colorMode];
        const values = Number.isFinite(dataset.pivot)
          ? [dataset.min, dataset.pivot, dataset.max]
          : [dataset.scaleMin, (dataset.scaleMin + dataset.scaleMax) / 2, dataset.scaleMax];
        const ramp = scheme === "continuous"
          ? Array.from({ length: 9 }, (_, index) => {
            const amount = index / 8;
            const sampleValue = dataset.scaleMin + (dataset.scaleMax - dataset.scaleMin) * amount;
            return datasetColor(dataset, sampleValue, "continuous", 0);
          }).join(", ")
          : Array.from({ length: BIN_COUNT }, (_, index) => {
            const color = colorFromStops(dataset.stops, index / (BIN_COUNT - 1));
            const start = (index / BIN_COUNT * 100).toFixed(2);
            const end = ((index + 1) / BIN_COUNT * 100).toFixed(2);
            return `${color} ${start}%, ${color} ${end}%`;
          }).join(", ");

        legend.className = "scale-legend";
        legend.setAttribute("aria-label", `${dataset.label} color scale`);
        const zeroNote = dataset.zeroAsEmpty ? " · zeros empty" : "";
        const title = document.createElement("div");
        title.className = "scale-title";
        title.textContent = scheme === "continuous"
          ? `${dataset.label}${zeroNote}`
          : `${dataset.label} · ${scheme === "quantile" ? "equal marks" : "equal range"}${zeroNote}`;
        const rampEl = document.createElement("div");
        rampEl.className = "scale-ramp";
        rampEl.style.setProperty("--ramp", `linear-gradient(90deg, ${ramp})`);
        const valuesRow = document.createElement("div");
        valuesRow.className = "scale-values";
        values.forEach((value) => {
          const span = document.createElement("span");
          span.textContent = formatValue(dataset, value);
          valuesRow.appendChild(span);
        });
        legend.append(title, rampEl, valuesRow);
      };

      const drawMonthScale = () => {
        const labelYear = new Date(anchorMs).getUTCFullYear();
        const tickInnerRadius = OUTER_RADIUS + 4;
        const tickOuterRadius = OUTER_RADIUS + 19;
        const labelRadius = OUTER_RADIUS + 42;

        for (let monthIndex = 0; monthIndex < 12; monthIndex += 1) {
          const boundaryMs = Date.UTC(labelYear, monthIndex, 1);
          const nextBoundaryMs = Date.UTC(labelYear, monthIndex + 1, 1);
          const midAngle = angleForDayOffset(((boundaryMs + nextBoundaryMs) / 2 - startMs) / MS_PER_DAY);

          const labelPoint = pointFromPolar(labelRadius, midAngle);
          const angleDeg = midAngle * 180 / Math.PI;
          let rotation = angleDeg + 90;
          const normalized = ((rotation + 180) % 360) - 180;
          if (normalized > 90 || normalized < -90) {
            rotation += 180;
          }

          const label = document.createElementNS(ns, "text");
          label.setAttribute("class", "month-label");
          label.setAttribute("x", labelPoint.x.toFixed(2));
          label.setAttribute("y", labelPoint.y.toFixed(2));
          label.setAttribute("text-anchor", "middle");
          label.setAttribute("dominant-baseline", "middle");
          label.setAttribute("transform", `rotate(${rotation.toFixed(2)} ${labelPoint.x.toFixed(2)} ${labelPoint.y.toFixed(2)})`);
          label.textContent = MONTHS[monthIndex].short;
          monthScale.appendChild(label);
        }

        for (let monthIndex = 0; monthIndex <= 12; monthIndex += 1) {
          const boundaryMs = Date.UTC(labelYear, monthIndex, 1);
          const angle = angleForDayOffset((boundaryMs - startMs) / MS_PER_DAY);
          const tickStart = pointFromPolar(tickInnerRadius, angle);
          const tickEnd = pointFromPolar(tickOuterRadius, angle);
          const tick = document.createElementNS(ns, "line");
          tick.setAttribute("class", "month-tick");
          tick.setAttribute("x1", tickStart.x.toFixed(2));
          tick.setAttribute("y1", tickStart.y.toFixed(2));
          tick.setAttribute("x2", tickEnd.x.toFixed(2));
          tick.setAttribute("y2", tickEnd.y.toFixed(2));
          monthScale.appendChild(tick);
        }
      };

      const addDateLabel = (dayIndex, text, dx, dy, anchor, view) => {
        const point = pointForDay(dayIndex, view);
        const label = document.createElementNS(ns, "text");
        label.setAttribute("class", "date-label");
        label.setAttribute("x", (point.x + dx).toFixed(2));
        label.setAttribute("y", (point.y + dy).toFixed(2));
        label.setAttribute("text-anchor", anchor);
        label.textContent = text;
        dateLabels.appendChild(label);
      };

      const render = () => {
        const view = currentView;
        const colorMode = currentColorMode;
        const scheme = currentScheme;
        clearGroup(areaCells);
        clearGroup(seasonalRibbon);
        clearGroup(days);
        clearGroup(dateLabels);
        clearGroup(summaryPlot);
        thread.removeAttribute("d");

        const pathCommands = [];

        for (let i = 0; i <= totalDays; i += 1) {
          const point = pointForDay(i, view);
          const date = new Date(point.dateMs);
          const monthIndex = date.getUTCMonth();
          const iso = formatIsoDay(date);
          const displayDate = formatDisplayDate(date);
          const fillColor = dayColor(i, monthIndex, colorMode, scheme);
          const tooltipText = colorMode === "month"
            ? MONTHS[monthIndex].short
            : `${DATASETS[colorMode].label}: ${formatValue(DATASETS[colorMode], DATASETS[colorMode].values[i])}`;

          if (view === "necklace") {
            pathCommands.push(`${i === 0 ? "M" : "L"}${point.x.toFixed(2)} ${point.y.toFixed(2)}`);
            const dot = document.createElementNS(ns, "circle");
            dot.setAttribute("class", "day");
            dot.setAttribute("cx", point.x.toFixed(2));
            dot.setAttribute("cy", point.y.toFixed(2));
            dot.setAttribute("r", DOT_RADIUS);
            dot.setAttribute("style", `--month-color: ${fillColor}`);
            dot.dataset.tooltipDate = displayDate;
            dot.dataset.tooltipValue = tooltipText;
            appendTitle(dot, titleForDay(iso, i, colorMode));
            days.appendChild(dot);
          } else {
            const cell = document.createElementNS(ns, "path");
            cell.setAttribute("class", "area-cell");
            cell.setAttribute("d", areaCellPath(i));
            cell.setAttribute("style", `--month-color: ${fillColor}`);
            cell.dataset.tooltipDate = displayDate;
            cell.dataset.tooltipValue = tooltipText;
            appendTitle(cell, titleForDay(iso, i, colorMode));
            areaCells.appendChild(cell);
          }
        }

        if (view === "necklace") {
          thread.setAttribute("d", pathCommands.join(" "));
        }
        renderLegend(colorMode, scheme);
        renderSeasonalRibbon(colorMode, view);
        renderSummaryPlot(colorMode);

        const viewLabel = view === "area" ? "equal-area tiles" : "daily pearls";
        const colorLabel = colorMode === "month" ? "month" : DATASETS[colorMode].metaLabel;
        meta.textContent = `${START_ISO} to ${END_ISO} · ${(totalDays + 1).toLocaleString()} ${viewLabel} · colored by ${colorLabel}`;
        captionLeft.textContent = view === "area"
          ? "Each day occupies the same area; inner turns grow thicker to compensate."
          : "Outer edge is the most recent date.";
        captionRight.textContent = colorMode === "month"
          ? "One revolution = 365.24219 days."
          : `${DATASETS[colorMode].label} · ${scheme === "continuous" ? "continuous color" : scheme === "quantile" ? "equal marks" : "equal range"}.`;

        schemeSelect.disabled = colorMode === "month";
        explainer.textContent = colorMode === "month"
          ? "Month mode uses calendar-month categories for the spiral cells. The center line summarizes daily high temperature from the same Open-Meteo San Francisco grid data."
          : `${DATASETS[colorMode].explainer} Source: ${WEATHER_DATA.source}; provider: ${WEATHER_DATA.provider}; grid ${WEATHER_DATA.latitude.toFixed(4)}, ${WEATHER_DATA.longitude.toFixed(4)}, elevation ${WEATHER_DATA.elevation} m; timezone ${WEATHER_DATA.timezone}.`;

        addDateLabel(0, formatDisplayDate(new Date(startMs)), -16, 5, "end", view);
        addDateLabel(totalDays, formatDisplayDate(new Date(endMs)), 0, 28, "middle", view);

        viewButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.view === view));
        });
      };

      viewButtons.forEach((button) => {
        button.addEventListener("click", () => {
          currentView = button.dataset.view;
          render();
        });
      });

      colorSelect.addEventListener("change", () => {
        currentColorMode = colorSelect.value;
        render();
      });

      schemeSelect.addEventListener("change", () => {
        currentScheme = schemeSelect.value;
        render();
      });

      const hideTooltip = () => {
        tooltip.hidden = true;
      };

      const positionTooltip = (event) => {
        const stageRect = event.currentTarget.closest(".stage").getBoundingClientRect();
        const tooltipWidth = tooltip.offsetWidth || 180;
        const tooltipHeight = tooltip.offsetHeight || 48;
        const x = Math.max(tooltipWidth / 2 + 8, Math.min(event.clientX - stageRect.left, stageRect.width - tooltipWidth / 2 - 8));
        const y = Math.max(tooltipHeight + 12, Math.min(event.clientY - stageRect.top, stageRect.height - 8));
        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
      };

      const showTooltip = (event) => {
        const mark = event.target.closest(".area-cell, .day");
        if (!mark) {
          return;
        }
        tooltipDate.textContent = mark.dataset.tooltipDate;
        tooltipValue.textContent = mark.dataset.tooltipValue;
        tooltip.hidden = false;
        positionTooltip(event);
      };

      const moveTooltip = (event) => {
        if (!tooltip.hidden) {
          positionTooltip(event);
        }
      };

      const leaveTooltip = (event) => {
        const mark = event.target.closest(".area-cell, .day");
        if (mark && !mark.contains(event.relatedTarget)) {
          hideTooltip();
        }
      };

      svg.addEventListener("pointerover", showTooltip);
      svg.addEventListener("pointermove", moveTooltip);
      svg.addEventListener("pointerout", leaveTooltip);
      svg.addEventListener("mouseover", showTooltip);
      svg.addEventListener("mousemove", moveTooltip);
      svg.addEventListener("mouseout", leaveTooltip);

      svg.addEventListener("pointerleave", hideTooltip);
      svg.addEventListener("mouseleave", hideTooltip);

      drawMonthScale();
      render();
    })();
  </script>
</body>
</html>
