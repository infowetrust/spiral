<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>San Francisco / Spiral Almanac</title>
    <meta
      name="description"
      content="Ten years of San Francisco, day by day: weather, home games, and annual events in an equal-area time spiral by RJ Andrews."
    />
    <meta name="author" content="RJ Andrews / Info We Trust" />
    <link rel="canonical" href="https://spiral.infowetrust.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="San Francisco / Spiral Almanac" />
    <meta
      property="og:description"
      content="Explore ten years of weather, home games, and the city's annual rhythms in a daily time spiral."
    />
    <meta property="og:url" content="https://spiral.infowetrust.com/" />
    <link rel="stylesheet" href="styles.css?v=almanac-20261003" />
    <script defer src="vendor/d3.v7.min.js"></script>
    <script defer src="data/weather.js"></script>
    <script defer src="data/sports.js"></script>
    <script defer src="data/air.js"></script>
    <script defer src="data/events.js"></script>
    <script defer src="core.js"></script>
    <script defer src="export.js?v=almanac-20261003"></script>
    <script defer src="app.js?v=almanac-20261003"></script>
  </head>
  <body>
    <main>
      <aside class="sidebar" aria-label="Chart settings and context">
        <header>
          <div>
            <h1>San Francisco<span>Spiral Almanac</span></h1>
            <p class="meta" id="meta">Ten years in a spiral</p>
          </div>
          <button
            class="export"
            id="export"
            type="button"
            aria-label="Download image"
            aria-haspopup="dialog"
            aria-expanded="false"
            title="Download image"
          >
            <img src="vendor/download.svg" width="18" height="18" alt="" />
          </button>
        </header>
        <section
          id="export-options"
          class="export-options"
          role="dialog"
          aria-label="Download image"
          hidden
        >
          <label class="field"
            >Format<select id="export-format">
              <option value="svg">SVG</option>
              <option value="png">PNG</option>
            </select></label
          >
          <label class="field"
            >Include<select id="export-scope">
              <option value="wheel">Wheel only (square)</option>
              <option value="page">Whole page</option>
            </select></label
          >
          <button id="export-save" type="button">
            <img
              src="vendor/download.svg"
              width="16"
              height="16"
              alt=""
            />Download
          </button>
          <p id="export-status" role="status"></p>
        </section>
        <section class="toolbar" aria-label="Chart controls">
          <div class="dataset-heading">
            <select
              id="color-select"
              aria-label="Dataset"
              aria-describedby="dataset-unit"
            >
              <option value="tempHigh">High temperature</option>
              <option value="precipitation">Precipitation</option>
              <option value="fogProxy">Fog / marine-layer proxy</option>
              <option value="windEnergy">Wind energy</option>
              <option value="windMax">Maximum wind</option>
              <option value="solar">Solar radiation</option>
              <option value="air">Fine particles / PM2.5</option>
              <option value="sports">SF home games</option>
              <option value="events">SF annual events</option>
              <option value="month">Calendar month</option>
            </select>
            <p id="dataset-unit" class="dataset-unit"></p>
          </div>
          <fieldset id="sports-teams" class="sports-teams" hidden>
            <legend>Home teams</legend>
            <label
              ><input id="team-warriors" type="checkbox" checked /><span
                class="swatch"
                style="background: #1d428a"
              ></span
              >Warriors <span class="team-league">NBA</span></label
            >
            <label
              ><input id="team-valkyries" type="checkbox" checked /><span
                class="swatch"
                style="background: #ad96dc"
              ></span
              >Valkyries <span class="team-league">WNBA</span></label
            >
            <label
              ><input id="team-giants" type="checkbox" checked /><span
                class="swatch"
                style="background: #fd5a1e"
              ></span
              >Giants <span class="team-league">MLB</span></label
            >
          </fieldset>
          <fieldset
            id="event-filters"
            class="sports-teams event-filters"
            hidden
          >
            <legend>Annual events</legend>
            <div class="event-actions">
              <button type="button" id="events-all">All</button
              ><button type="button" id="events-none">None</button>
            </div>
            <div id="event-options"></div>
            <label
              ><input id="event-symbols" type="checkbox" checked />Emoji
              markers</label
            >
          </fieldset>
          <section class="legend-section" aria-label="Color legend">
            <div class="legend-main" id="legend"></div>
            <div class="key-group" id="legend-keys"></div>
          </section>
          <label class="field"
            ><span>Color scale</span
            ><select id="scheme-select">
              <option value="continuous">Continuous</option>
              <option value="quantile">Equal counts</option>
              <option value="quantize">Equal ranges</option>
            </select></label
          >
          <label class="field"
            ><span>Smoothing</span
            ><select id="smooth-select">
              <option value="1">None (daily)</option>
              <option value="7">7-day mean</option>
              <option value="21">21-day mean</option>
            </select></label
          >
          <label class="reverse" id="sqrt-control" hidden>
            <input type="checkbox" id="sqrt-scale" />Square-root color scale
          </label>
          <details class="display-options">
            <summary>Display</summary>
            <div class="display-fields">
              <label class="field"
                ><span>Seasonal mean</span
                ><select id="summary-select">
                  <option id="summary-area" value="area">Filled area</option>
                  <option value="contour">Polar contour</option>
                  <option value="ribbon">Variable ribbon</option>
                  <option value="off">None</option>
                </select></label
              >
              <div class="field">
                <span>View</span>
                <div class="segments" aria-label="View">
                  <button type="button" data-view="area" aria-pressed="true">
                    Area</button
                  ><button
                    type="button"
                    data-view="necklace"
                    aria-pressed="false"
                  >
                    Necklace
                  </button>
                </div>
              </div>
              <label class="reverse"
                ><input type="checkbox" id="reverse" />Counterclockwise</label
              >
            </div>
          </details>
        </section>
        <div id="summary-sidebar"></div>
        <details class="inspection-details">
          <summary>Inspect a day</summary>
          <section class="inspection" aria-label="Inspect a day">
            <label class="field"
              >Date<input type="date" id="inspect-date"
            /></label>
            <p id="inspect-value" aria-live="polite"></p>
            <div class="source-links" id="inspect-links"></div>
          </section>
        </details>
        <details class="source-section">
          <summary>About this data</summary>
          <div class="source-content" id="source-content"></div>
          <p class="summary-caption" id="summary-caption"></p>
        </details>
        <footer class="footer">
          <a
            class="footer-brand"
            href="https://infowetrust.com/"
            aria-label="Info We Trust"
          >
            <!-- Embedded from vendor/infowetrust-wordmark.svg for offline image exports. -->
            <svg
              class="wordmark"
              viewBox="0 0 1047.8 224.6"
              role="img"
              aria-label="Info We Trust"
            >
              <image
                width="1047.8"
                height="224.6"
                href="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPHN2ZyBpZD0iTGF5ZXJfMSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB2ZXJzaW9uPSIxLjEiIHZpZXdCb3g9IjAgMCAxMDQ3LjggMjI0LjYiPgogIDwhLS0gR2VuZXJhdG9yOiBBZG9iZSBJbGx1c3RyYXRvciAzMC4xLjAsIFNWRyBFeHBvcnQgUGx1Zy1JbiAuIFNWRyBWZXJzaW9uOiAyLjEuMSBCdWlsZCAxMzYpICAtLT4KICA8ZGVmcz4KICAgIDxzdHlsZT4KICAgICAgLnN0MCB7CiAgICAgICAgaXNvbGF0aW9uOiBpc29sYXRlOwogICAgICB9CgogICAgICAuc3QxIHsKICAgICAgICBsZXR0ZXItc3BhY2luZzogMGVtOwogICAgICB9CgogICAgICAuc3QxLCAuc3QyLCAuc3QzIHsKICAgICAgICBmb250LWZhbWlseTogQmlnQ2FzbG9uRkItQmxhY2ssICdCaWcgQ2FzbG9uIENDJzsKICAgICAgICBmb250LXNpemU6IDIwMHB4OwogICAgICAgIGZvbnQtd2VpZ2h0OiA4MDA7CiAgICAgIH0KCiAgICAgIC5zdDMgewogICAgICAgIGxldHRlci1zcGFjaW5nOiAwZW07CiAgICAgIH0KICAgIDwvc3R5bGU+CiAgPC9kZWZzPgogIDxnIGlkPSJMYXllcl8yIj4KICAgIDxnIGlkPSJMYXllcl8yLTIiPgogICAgICA8ZyBpZD0iQmlnX0Nhc2xvbiIgY2xhc3M9InN0MCI+CiAgICAgICAgPHRleHQgY2xhc3M9InN0MiIgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMCAxNzIpIj48dHNwYW4geD0iMCIgeT0iMCI+aW5mbyA8L3RzcGFuPjwvdGV4dD4KICAgICAgICA8dGV4dCBjbGFzcz0ic3QzIiB0cmFuc2Zvcm09InRyYW5zbGF0ZSgzNjUuNiAxNzIpIj48dHNwYW4geD0iMCIgeT0iMCI+dzwvdHNwYW4+PC90ZXh0PgogICAgICAgIDx0ZXh0IGNsYXNzPSJzdDIiIHRyYW5zZm9ybT0idHJhbnNsYXRlKDUwNy4yIDE3MikiPjx0c3BhbiB4PSIwIiB5PSIwIj5lIHQ8L3RzcGFuPjwvdGV4dD4KICAgICAgICA8dGV4dCBjbGFzcz0ic3QxIiB0cmFuc2Zvcm09InRyYW5zbGF0ZSg3MDYuMiAxNzIpIj48dHNwYW4geD0iMCIgeT0iMCI+cjwvdHNwYW4+PC90ZXh0PgogICAgICAgIDx0ZXh0IGNsYXNzPSJzdDIiIHRyYW5zZm9ybT0idHJhbnNsYXRlKDc4NS40IDE3MikiPjx0c3BhbiB4PSIwIiB5PSIwIj51c3Q8L3RzcGFuPjwvdGV4dD4KICAgICAgPC9nPgogICAgPC9nPgogIDwvZz4KPC9zdmc+"
              />
            </svg>
          </a>
          <p class="footer-credit">
            Design &amp; visualization © 2026 RJ Andrews.
          </p>
          <div class="project-notes">
            <span>One revolution = 365.24219 days</span>
            <span>Equal area per day</span>
            <a href="docs/design-journal.md">Design journal</a>
            <a href="README.md">Data &amp; project notes</a>
          </div>
        </footer>
      </aside>
      <figure class="chart-panel">
        <div class="stage">
          <svg
            id="spiral"
            class="spiral"
            viewBox="0 0 1000 1000"
            role="img"
            aria-labelledby="spiral-title spiral-desc"
          >
            <title id="spiral-title">San Francisco daily time spiral</title>
            <desc id="spiral-desc">
              Each cell is one day with equal area. Older dates are inside. A
              complete turn spans 365.24219 days.
            </desc>
            <defs id="defs"></defs>
            <g id="cells"></g>
            <g id="postseason"></g>
            <g id="event-markers" aria-hidden="true"></g>
            <g id="seasonal"></g>
            <g id="labels"></g>
            <g id="selected"></g>
          </svg>
          <div class="center-copy" id="center-copy" aria-live="polite"></div>
        </div>
      </figure>
      <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
      <noscript
        >This page needs JavaScript to render the spiral. Data and sources are
        in the data and docs folders.</noscript
      >
    </main>
  </body>
</html>
